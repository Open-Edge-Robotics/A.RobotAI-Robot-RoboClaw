[project]
name = "robo-claw"
version = "0.1.0"
description = "AI Agent Runtime for ROS 2"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.39.0",
    "ollama>=0.1.0",
    "langsmith>=0.1.100",
    "pyTelegramBotAPI>=4.12.0",
    "slack-sdk>=3.21.0",
    "discord.py>=2.3.0",
    "grpcio>=1.59.0",
    "grpcio-tools>=1.59.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "PyYAML>=6.0.0",
    "numpy>=1.24.0,<2.0.0",
    "opencv-python>=4.8.0",
    "setuptools",
    "mcp>=1.27,<2",
    "qdrant-client>=1.17.1",
    "sqlmodel>=0.0.21",
    "aiosqlite>=0.19.0",
    "psutil>=5.9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "ultralytics>=8.4.48",
    "ruff>=0.11.0",
    "pytest-cov>=5.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["*_pb2.py", "*_pb2.pyi", "*_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "G"]
ignore = [
    "E402",   # ROS2 환경에서 sys.path 조작 후 import하는 패턴 허용
    "E501",   # line-length는 formatter가 담당
    "G004",   # f-string을 사용한 로깅 허용 (가독성 및 유지보수성 확보)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # 테스트에서 assert False 허용

[tool.pytest.ini_options]
testpaths = [
    "src/robo_claw_agent/tests",
    "src/robo_claw_channel/tests",
    "src/robo_claw_discovery/tests",
    "src/robo_claw_grpc/tests",
    "src/robo_claw_dashboard/tests",
    "src/robo_claw_bringup/tests",
]
addopts = "--strict-markers"
asyncio_mode = "auto"
markers = [
    "unit: 외부 시스템 없이 실행 가능한 빠른 단위 테스트",
    "component: 하나의 애플리케이션 컴포넌트를 검증하는 테스트",
    "integration: 여러 컴포넌트의 통합을 검증하는 테스트",
    "ros2: ROS2 환경(rclpy, nav_msgs 등)이 필요한 테스트",
    "hardware: 실제 하드웨어 또는 하드웨어에 가까운 환경이 필요한 테스트",
    "slow: 일반 개발 루프에서 제외할 수 있는 느린 테스트",
    "asyncio: 비동기 테스트 (pytest-asyncio 제공)",
    "qdrant: qdrant-client 패키지가 필요한 테스트",
    "mcp: mcp 패키지가 필요한 테스트",
]

[tool.coverage.run]
source = ["robo_claw_agent", "robo_claw_channel", "robo_claw_discovery", "robo_claw_grpc", "robo_claw_dashboard"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "robo_claw_agent.agent_node.execution"
# ExecutionMixin이 AgentNode 속성에 접근하는 패턴은 타입 검증에서 제외
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "rclpy.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "robo_claw_msgs.*"
ignore_errors = true
