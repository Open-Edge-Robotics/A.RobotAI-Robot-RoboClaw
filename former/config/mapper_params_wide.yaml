slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping #localization

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0      # 넓은 영역에서 연산 부하를 줄이기 위해 업데이트 주기를 1.0s -> 2.0s로 변경
    resolution: 0.05              # 맵 해상도를 2.5cm -> 5cm로 완화하여 그래프 탐색 연산오류 방지 및 메모리 보존
    max_laser_range: 25.0         # 넓은 영역의 벽과 장애물을 더 멀리 감지하도록 라이다 유효 반경 확대 (기존 12m)
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000 
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1  # 키프레임 포즈 업데이트 주기를 1cm -> 10cm로 늘려 노드 수 최적화 및 연산 완화
    minimum_travel_heading: 0.08  # 최소 5도 이상 회전 시에만 스캔 매칭 추가
    scan_buffer_size: 5
    scan_buffer_maximum_scan_distance: 25.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 2.0
    loop_search_maximum_distance: 10.0 # 누적 오차 교정을 위한 루프 백그라운드 탐색 거리 확장 (기존 3m)
    do_loop_closing: true
    loop_match_minimum_chain_size: 15  # 가짜 루프(False positive) 방지를 위해 매칭 체인 크기 확대 (기존 10)
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.40 # 가짜 루프 매칭 결합을 방지하기 위한 임계값 증가 (기존 0.35)
    loop_match_minimum_response_fine: 0.50   # 기존 0.45

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.6
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 15.0 # 대형 환경 루프 결합을 위해 서치 스페이스 차원 확대 (기존 8m -> 15m)
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.3 # 오도메트리 불안정성을 상쇄하기 위해 오도메트리 영향 가중치 감소 (기존 0.5)
    angle_variance_penalty: 0.7    # 기존 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
