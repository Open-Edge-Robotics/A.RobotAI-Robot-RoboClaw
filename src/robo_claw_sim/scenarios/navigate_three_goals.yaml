name: navigate_three_goals
timeout_sec: 90
# 세 목표 연속 수행. goal 순회·도달 판정이 백엔드와 무관한지 확인한다.
# (제어기는 전역 계획이 없어 목표 사이 직선 경로가 장애물을 피하도록 배치한다.)
world:
  width: 8.0
  height: 6.0
  resolution: 0.05
  robot: {x: 1.0, y: 1.0, yaw: 0.0}
  robot_radius: 0.22
  obstacles:
    - {type: circle, name: pillar_a, x: 3.4, y: 2.8, radius: 0.45}
    - {type: circle, name: pillar_b, x: 5.6, y: 4.4, radius: 0.40}
  objects:
    - {name: cup_1, class_id: cup, x: 6.8, y: 1.4, radius: 0.06}
goals:
  - {x: 2.4, y: 4.4, tolerance: 0.3, yaw: 1.57, label: northwest}
  - {x: 6.4, y: 2.4, tolerance: 0.3, yaw: 0.0, label: east_center}
  - {x: 1.2, y: 1.2, tolerance: 0.3, yaw: 3.14, label: home}
expect:
  max_collisions: 0
  min_goals_reached: 3
  max_elapsed_sec: 90
  require_no_abort: true
injections: []
