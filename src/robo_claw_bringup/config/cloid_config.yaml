robo_claw_core_node:
  ros__parameters:
    loop_rate_hz: 50.0
    agent_id: "cloid_agent"

    # CLOiD(CLOi-D) 는 로봇 측 tofu(tofu_control) 컨테이너가 robot_state_publisher 를
    # 실행하고, URDF(hmc_v2_hand)는 그 컨테이너 이미지 안에만 존재한다. robo_claw
    # 컨테이너에서는 해당 파일에 접근할 수 없으므로 robot_description_file 을 지정하지
    # 않는다. 이 경우 core_node 는 /joint_states 의 조인트 이름으로 관절을 자동
    # 등록(discovery)한다.
    # 로봇의 URDF/TF 기준 팔·waist·neck 조인트 한계는 ROBOT_LIMITS.cloid.json 참고.
    # robot_description_file: ""

    # 센서 목록
    # SensorManager 는 IMU(sensor_msgs/Imu) / LIDAR(sensor_msgs/LaserScan) /
    # CAMERA(sensor_msgs/Image) 만 구독해 activity 를 추적한다. 아래 두 개만 등록한다.
    #
    # 주의: 센서 이름에 "camera" 가 들어가면 launch 의 camera_topic 자동 해석
    # (_resolve_camera_topic)이 그 토픽을 agent/vision 카메라로 선택한다. CLOiD 의
    # agent 카메라는 compressed 헤드 RGB(rgb_cam_head_front_left)여야 하므로,
    # raw Image 를 추적하는 이 센서는 link 이름(front_d435)으로 등록하고 agent
    # camera_topic 은 robo_claw_agent_node 에서 명시한다.
    sensor_names:
      - "imu"
      - "front_d435"

    # 센서 토픽 매핑 (sensor_topics.<sensor_name>)
    sensor_topics:
      # chest_link 에 장착된 IMU 브로드캐스터
      imu: "/chest_imu_broadcaster/imu"
      # 전면 D435 depth 스트림(raw sensor_msgs/Image, 15Hz).
      # CLOiD 의 RGB 카메라(rgb_cam_*)는 CompressedImage 만 발행하므로 activity
      # 추적 대상으로는 raw Image 를 발행하는 이 토픽을 사용한다.
      front_d435: "/camera_front/camera_front/depth/image_rect_raw"

    # CLOiD 는 2D LaserScan(/scan)을 발행하지 않는다(장애물 인지는 3D 라이다
    # /lidar_points_bounded 와 Nav2 costmap 사용). 3D 포인트클라우드 activity 추적은
    # SensorManager 에 아직 없으므로 lidar 센서는 등록하지 않는다.

    # 제어 명령 매핑
    # 주의: Tofu 의 diff_drive_controller 는 /cmd_vel 을 geometry_msgs/TwistStamped 로
    # 구독한다. robo_claw 의 직접 cmd_vel 제어(Twist)는 이 로봇에 적용되지 않으므로
    # 베이스 이동·회전은 Nav2 action(navigate_to_pose, spin)을 사용한다.
    cmd_vel_topic: "/cmd_vel"
    odom_topic: "/odom"

robo_claw_agent_node:
  ros__parameters:
    # 자가진단용 센서 토픽
    # lidar_topic 기본값은 /scan 이며, CLOiD 에는 LaserScan 토픽이 없어 health state
    # 에 LIDAR_NO_DATA 가 표시된다(알려진 한계, 3D 라이다 health check 미구현).
    lidar_topic: "/scan"
    imu_topic: "/chest_imu_broadcaster/imu"
    # VLM 분석·객체 인식용 카메라(전면 헤드 RGB). CLOiD 는 CompressedImage 만
    # 발행하므로 compressed 토픽을 지정한다(skill_manager 가 자동으로 분기).
    # depth/camera_info 토픽은 지정하지 않는다 — 헤드 RGB 카메라의 optical frame 이
    # TF 트리에 없어 3D 역투영이 성립하지 않는다.
    camera_topic: "/rgb_cam_head_front_left/image_raw/compressed"
    # Robot-local OccupancyGrid for map skills and gRPC telemetry.
    map_topic: "/lio/grid_map"
    # latched 맵은 stamp와 관계없이 수용하며 freshness는 volatile 스트림에만 적용한다.
    # map_is_static 파라미터는 선언·문서화를 유지하되 freshness 게이트에는 관여하지 않는다.
    map_is_static: false

    # 실제 모션 목록은 /task_manager/motion_map 토픽에서 읽는다. 토픽이 비어 있을 때만
    # 읽기 전용 파일 fallback을 사용하며, 파일은 RoboClaw 컨테이너 내부에 마운트되어야 한다.
    cloid_motion_catalog_file: "/ws/motion_list/motion_map.json"
    # CLOi 개체별 상체 상태를 확인할 수 없어 공통 프로필은 표시 모션을 비활성화한다.
    # 1호에서만 안전 확인 후 별도의 정리 시연 기능을 명시적으로 활성화한다.
    cloid_cleanup_indicator_enabled: false
    cloid_cleanup_indicator_motion_ids_json: '[]'

    # 시연 cue — 시연 모션 요청/실행 직후 외부 장비로 UTF-8 바이트를 1회 전송한다.
    # 노드 기본값도 활성이지만, 목적지는 배포 환경 값이므로 프로필에 명시한다.
    # 전송 실패·타임아웃은 시연 결과를 바꾸지 않으며, payload 는 설정값만 사용한다.
    # 개행은 terminator(none|lf|crlf)로만 붙인다. 끄려면 enabled: false.
    cloid_demo_signal_enabled: true
    cloid_demo_signal_protocol: "tcp"
    cloid_demo_signal_host: "192.168.50.86"
    cloid_demo_signal_port: 5005
    cloid_demo_signal_payload: "shoe pick"
    cloid_demo_signal_terminator: "none"
    cloid_demo_signal_timeout_sec: 1.0
    # 시연 모션 요청 후 STOP(MotionCmd) 까지 기다리는 시간(초). 모션 길이보다 길게
    # 두고, STOP 후에 시연 cue 를 보내 다른 프로그램이 joint 를 제어할 수 있게 한다.
    cloid_demo_stop_after_sec: 8.0
    # 신발·신발장 시연 전에 맞출 절대 방위(map 프레임, 도). 빈 값이면 회전하지 않는다.
    cloid_demo_shoe_heading_deg: 64.2

    # manipulation — CLOiD 팔/hand 제어 백엔드는 아직 구현되지 않았다.
    # manipulation_enabled=false 로 조작 계열 스킬을 실행 단에서 차단한다.
    manipulation_enabled: false
    manipulation_backend: "moveit"

robo_claw_dashboard_node:
  ros__parameters:
    # 일반 채팅(/api/chat) 실행 예산과 HTTP 응답 대기 상한(초).
    # request_timeout_sec 은 조회/RPC 상한이므로 작업 예산으로 쓰지 않는다. 작업 예산은
    # ExecuteTask goal 의 timeout_sec 으로 전달되며, 대기 상한을 넘기면 대시보드는
    # 결과를 "미확인"으로 돌려주고 에이전트는 계속 실행한다.
    chat_task_timeout_sec: 600.0
    chat_result_wait_sec: 60.0
    # CLOiD LIO(lio-fr-system) 연동 — 지도 표시는 map_topic(/lio/grid_map)을 그대로 쓰고,
    # 아래 값은 대시보드에서 저장된 지도를 적용해 위치추정을 시작하는 데 쓴다.
    lio_status_topic: "/lio_node/status"
    switch_mode_service: "/switch_mode"
    # 저장된 3D/2D 맵 디렉터리(lio-fr-system 컨테이너 기준 경로). 대시보드 컨테이너에
    # 같은 경로로 마운트하면 하위 디렉터리를 지도 목록으로 읽는다.
    localization_map_dir: "/ws/maps"
    # 지도 목록 allowlist. 비어 있으면 localization_map_dir 를 읽어 목록을 만든다.
    # 이 값을 지정하면 그 목록만 허용하므로 사이트에서 허용할 지도만 노출할 수 있다.
    # 예: '["FACTORYMAP", "konjiam_L_107"]'
    localization_map_names_json: '[]'
    # /switch_mode 응답 대기 상한(초). LIO 는 3D 맵 로드 후 응답하므로 넉넉히 둔다.
    switch_mode_timeout_sec: 200.0
    # /initialpose 공분산(대각 x/y/yaw). CLOiD 자체 UI(0.25/0.07)와 동작을 맞추려면
    # 0.25 로 올린다. 값이 작을수록 초기 추정을 더 확신하므로 잘못된 좌표에 취약하다.
    initialpose_covariance: 0.05
