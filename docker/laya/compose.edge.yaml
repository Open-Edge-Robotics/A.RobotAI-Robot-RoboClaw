# 엣지 서버(NVIDIA GPU)용 Laya 서버 실행 예시.
#
#   cd docker/laya
#   LAYA_API_KEY=<랜덤 토큰> docker compose -f compose.edge.yaml up -d --build
#
# robo-claw 설정:
#   SYSTEM1_ROUTER=laya
#   SYSTEM1_ENDPOINT=http://<엣지서버 IP>:8000
#   SYSTEM1_API_KEY=<위와 같은 토큰>
#
# 사전 조건: 호스트에 NVIDIA 드라이버와 NVIDIA Container Toolkit 이 설치되어 있어야 한다.
# GPU 없이 실행하려면 build.args 의 LAYA_TORCH_INDEX_URL 을 cpu 인덱스로 바꾸고 deploy 블록을 지운다.
services:
  laya:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LAYA_TORCH_INDEX_URL: ${LAYA_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu128}
    image: robo-claw-laya:edge
    container_name: robo-claw-laya
    ports:
      - "${LAYA_PORT:-8000}:8000"
    environment:
      LAYA_DEVICE: ${LAYA_DEVICE:-cuda}
      LAYA_API_KEY: ${LAYA_API_KEY:-}
    volumes:
      - laya-hf:/opt/hf
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  laya-hf:
