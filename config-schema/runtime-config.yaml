# Deprecated compatibility snapshot. The source of truth is the pinned release
# in ../contracts/runtime-contract.json from rcf-config-contract.
schema_version: "2.0"
status: stable
description: Canonical core RoboClaw runtime settings registry.

settings:
  llm.provider:
    type: string
    scope: runtime
    default: azure
    enum: [azure, openai, anthropic, ollama]
    secret: false
    description: LLM provider used by the agent.
    env: {name: RC_LLM_PROVIDER}
    api: {json_name: llm_provider}
    ros: {launch_argument: llm_provider, parameter: llm_provider, value_type: string}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  llm.model:
    type: string
    scope: runtime
    default: gpt-4.1
    secret: false
    description: Main conversation model name.
    env: {name: RC_LLM_MODEL}
    api: {json_name: llm_model}
    ros: {launch_argument: llm_model, parameter: llm_model, value_type: string}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  ros.domain_id:
    type: integer
    scope: host
    default: 0
    minimum: 0
    maximum: 232
    secret: false
    description: ROS 2 domain identifier.
    env: {name: ROS_DOMAIN_ID}
    api: {json_name: ros_domain_id}
    ros: {launch_argument: "", parameter: "", value_type: env}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  agent.id:
    type: string
    scope: runtime
    default: robo_claw_agent
    secret: false
    description: Stable identity used by agent and peer discovery.
    env: {name: RC_AGENT_ID}
    api: {json_name: agent_id}
    ros: {launch_argument: agent_id, parameter: agent_id, value_type: string}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  rag.enabled:
    type: boolean
    scope: runtime
    default: false
    secret: false
    description: Enable retrieval augmented generation.
    env: {name: RC_ENABLE_RAG}
    api: {json_name: enable_rag}
    ros: {launch_argument: enable_rag, parameter: enable_rag, value_type: bool}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  rag.top_k:
    type: integer
    scope: runtime
    default: 2
    minimum: 0
    secret: false
    description: Number of RAG results returned to the planner.
    env: {name: RC_RAG_TOP_K}
    api: {json_name: rag_top_k}
    ros: {launch_argument: rag_top_k, parameter: rag_top_k, value_type: int}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  task.strict_config:
    type: boolean
    scope: runtime
    default: false
    secret: false
    description: Fail startup when required runtime files are missing.
    env: {name: RC_STRICT_CONFIG}
    api: {json_name: strict_config}
    ros: {launch_argument: strict_config, parameter: strict_config, value_type: bool}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  http.port:
    type: integer
    scope: runtime
    default: 8080
    minimum: 1
    maximum: 65535
    secret: false
    description: RoboClaw HTTP channel port.
    env: {name: RC_HTTP_PORT}
    api: {json_name: http_port}
    ros: {launch_argument: http_port, parameter: http_port, value_type: int}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  http.control_token:
    type: string
    scope: secret
    default: ""
    secret: true
    description: Token required for HTTP control operations.
    env: {name: RC_HTTP_CONTROL_TOKEN}
    api: {json_name: http_control_token}
    ros: {launch_argument: http_control_token, parameter: http_control_token, value_type: string}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  messenger.server.port:
    type: integer
    scope: runtime
    default: 50052
    minimum: 1
    maximum: 65535
    secret: false
    description: RoboMessenger gRPC server port.
    env: {name: ROBO_CLAW_GRPC_PORT}
    api: {json_name: grpc_port}
    ros: {launch_argument: grpc_port, parameter: grpc_port, value_type: int}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  messenger.peer_token:
    type: string
    scope: secret
    default: ""
    secret: true
    description: Shared peer authentication token.
    env: {name: GRPC_PEER_TOKEN}
    api: {json_name: grpc_peer_token}
    ros: {launch_argument: grpc_peer_token, parameter: grpc_peer_token, value_type: string}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  vision.enabled:
    type: boolean
    scope: runtime
    default: false
    secret: false
    description: Enable the ONNX object detector.
    env: {name: RC_USE_VISION}
    api: {json_name: use_vision}
    ros: {launch_argument: use_vision, parameter: use_vision, value_type: bool}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  vision.model_path:
    type: path
    scope: host
    default: ""
    secret: false
    description: ONNX model path used when vision is enabled.
    env: {name: RC_VISION_MODEL_PATH}
    api: {json_name: vision_model_path}
    ros: {launch_argument: vision_model_path, parameter: model_path, value_type: string}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  ollama.base_url:
    type: string
    scope: runtime
    default: http://127.0.0.1:11434
    secret: false
    description: Ollama service endpoint.
    env: {name: RC_OLLAMA_BASE_URL}
    api: {json_name: ollama_base_url}
    ros: {launch_argument: llm_base_url, parameter: llm_base_url, value_type: string}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  ollama.options:
    type: object
    scope: runtime
    default: {}
    secret: false
    description: Ollama generation options JSON object.
    env: {name: RC_OLLAMA_OPTIONS_JSON}
    api: {json_name: ollama_options_json}
    ros: {launch_argument: ollama_options_json, parameter: ollama_options_json, value_type: string}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  embedding.model:
    type: string
    scope: runtime
    default: ""
    secret: false
    description: Embedding model used by RAG.
    env: {name: RC_LLM_EMBEDDING_MODEL}
    api: {json_name: llm_embedding_model}
    ros: {launch_argument: llm_embedding_model, parameter: llm_embedding_model, value_type: string}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  embedding.provider:
    type: string
    scope: runtime
    default: ""
    secret: false
    description: Provider used for embedding generation.
    env: {name: RC_LLM_EMBEDDING_PROVIDER}
    api: {json_name: llm_embedding_provider}
    ros: {launch_argument: llm_embedding_provider, parameter: llm_embedding_provider, value_type: string}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  embedding.base_url:
    type: string
    scope: runtime
    default: ""
    secret: false
    description: Optional embedding provider endpoint.
    env: {name: RC_LLM_EMBEDDING_BASE_URL}
    api: {json_name: llm_embedding_base_url}
    ros: {launch_argument: llm_embedding_base_url, parameter: llm_embedding_base_url, value_type: string}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  embedding.api_key:
    type: string
    scope: secret
    default: ""
    secret: true
    description: Embedding provider API key.
    env: {name: RC_LLM_EMBEDDING_API_KEY}
    api: {json_name: llm_embedding_api_key}
    ros: {launch_argument: llm_embedding_api_key, parameter: llm_embedding_api_key, value_type: string}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  rag.vector_backend:
    type: string
    scope: runtime
    default: local
    enum: [local, qdrant]
    secret: false
    description: Vector storage backend.
    env: {name: RC_RAG_VECTOR_BACKEND}
    api: {json_name: rag_vector_backend}
    ros: {launch_argument: rag_vector_backend, parameter: rag_vector_backend, value_type: string}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  rag.score_threshold:
    type: number
    scope: runtime
    default: 0.7
    minimum: 0
    maximum: 1
    secret: false
    description: Minimum RAG similarity score.
    env: {name: RC_RAG_SCORE_THRESHOLD}
    api: {json_name: rag_score_threshold}
    ros: {launch_argument: rag_score_threshold, parameter: rag_score_threshold, value_type: float}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  rag.local_mirror:
    type: boolean
    scope: runtime
    default: true
    secret: false
    description: Mirror remote vector entries in local memory.
    env: {name: RC_RAG_LOCAL_MIRROR}
    api: {json_name: rag_local_mirror}
    ros: {launch_argument: rag_local_mirror, parameter: rag_local_mirror, value_type: bool}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  qdrant.url:
    type: string
    scope: runtime
    default: http://127.0.0.1:6333
    secret: false
    description: Qdrant endpoint.
    env: {name: QDRANT_URL}
    api: {json_name: qdrant_url}
    ros: {launch_argument: qdrant_url, parameter: qdrant_url, value_type: string}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  qdrant.api_key:
    type: string
    scope: secret
    default: ""
    secret: true
    description: Qdrant API key.
    env: {name: QDRANT_API_KEY}
    api: {json_name: qdrant_api_key}
    ros: {launch_argument: qdrant_api_key, parameter: qdrant_api_key, value_type: string}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  task.queue_max_size:
    type: integer
    scope: runtime
    default: 8
    minimum: 0
    secret: false
    description: Maximum pending task queue size.
    env: {name: RC_TASK_QUEUE_MAX_SIZE}
    api: {json_name: task_queue_max_size}
    ros: {launch_argument: task_queue_max_size, parameter: task_queue_max_size, value_type: int}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  task.llm_fail_fast:
    type: boolean
    scope: runtime
    default: false
    secret: false
    description: Fail startup when LLM health validation fails.
    env: {name: RC_LLM_FAIL_FAST}
    api: {json_name: llm_fail_fast}
    ros: {launch_argument: llm_fail_fast, parameter: llm_fail_fast, value_type: bool}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  task.decomposition_enabled:
    type: boolean
    scope: runtime
    default: true
    secret: false
    description: Decompose multi-step natural language tasks.
    env: {name: RC_ENABLE_TASK_DECOMPOSITION}
    api: {json_name: enable_task_decomposition}
    ros: {launch_argument: enable_task_decomposition, parameter: enable_task_decomposition, value_type: bool}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  task.decomposition_max_steps:
    type: integer
    scope: runtime
    default: 6
    minimum: 0
    secret: false
    description: Maximum number of decomposed task steps.
    env: {name: RC_TASK_DECOMPOSITION_MAX_STEPS}
    api: {json_name: task_decomposition_max_steps}
    ros: {launch_argument: task_decomposition_max_steps, parameter: task_decomposition_max_steps, value_type: int}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  task.step_max_retries:
    type: integer
    scope: runtime
    default: 1
    minimum: 0
    secret: false
    description: Retry count for a failed decomposed step.
    env: {name: RC_TASK_STEP_MAX_RETRIES}
    api: {json_name: task_step_max_retries}
    ros: {launch_argument: task_step_max_retries, parameter: task_step_max_retries, value_type: int}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  http.host:
    type: string
    scope: runtime
    default: 127.0.0.1
    secret: false
    description: HTTP channel bind host.
    env: {name: RC_HTTP_HOST}
    api: {json_name: http_host}
    ros: {launch_argument: http_host, parameter: http_host, value_type: string}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  http.allowed_cidrs:
    type: array
    scope: runtime
    default: []
    secret: false
    description: Allowed client CIDR array for HTTP channel.
    env: {name: RC_HTTP_ALLOWED_CIDRS_JSON}
    api: {json_name: http_allowed_cidrs_json}
    ros: {launch_argument: http_allowed_cidrs_json, parameter: http_allowed_cidrs_json, value_type: json}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  http.rate_limit_per_minute:
    type: integer
    scope: runtime
    default: 60
    minimum: 0
    secret: false
    description: HTTP request rate limit per minute.
    env: {name: RC_HTTP_RATE_LIMIT_PER_MINUTE}
    api: {json_name: http_rate_limit_per_minute}
    ros: {launch_argument: http_rate_limit_per_minute, parameter: http_rate_limit_per_minute, value_type: int}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  channels.discord_enabled:
    type: boolean
    scope: runtime
    default: false
    secret: false
    description: Enable Discord channel.
    env: {name: ENABLE_DISCORD}
    api: {json_name: enable_discord}
    ros: {launch_argument: enable_discord, parameter: enable_discord, value_type: bool}
    modes: {local: true, docker: true, simulation: false, config_server: true}

  channels.discord_token:
    type: string
    scope: secret
    default: ""
    secret: true
    description: Discord bot token.
    env: {name: DISCORD_BOT_TOKEN}
    api: {json_name: discord_bot_token}
    ros: {launch_argument: discord_token, parameter: discord_token, value_type: string}
    modes: {local: true, docker: true, simulation: false, config_server: true}

  channels.telegram_enabled:
    type: boolean
    scope: runtime
    default: false
    secret: false
    description: Enable Telegram channel.
    env: {name: ENABLE_TELEGRAM}
    api: {json_name: enable_telegram}
    ros: {launch_argument: enable_telegram, parameter: enable_telegram, value_type: bool}
    modes: {local: true, docker: true, simulation: false, config_server: true}

  channels.slack_enabled:
    type: boolean
    scope: runtime
    default: false
    secret: false
    description: Enable Slack channel.
    env: {name: ENABLE_SLACK}
    api: {json_name: enable_slack}
    ros: {launch_argument: enable_slack, parameter: enable_slack, value_type: bool}
    modes: {local: true, docker: true, simulation: false, config_server: true}

  mcp.enabled:
    type: boolean
    scope: runtime
    default: false
    secret: false
    description: Enable Model Context Protocol servers.
    env: {name: RC_ENABLE_MCP}
    api: {json_name: enable_mcp}
    ros: {launch_argument: mcp_enabled, parameter: mcp_enabled, value_type: bool}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  mcp.servers:
    type: array
    scope: secret
    default: []
    secret: true
    description: MCP server definitions, which may contain credentials.
    env: {name: RC_MCP_SERVERS_JSON}
    api: {json_name: mcp_servers_json}
    ros: {launch_argument: mcp_servers_json, parameter: mcp_servers_json, value_type: json}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  diagnostics.lidar_topic:
    type: string
    scope: robot_profile
    default: ""
    secret: false
    description: Lidar topic used by sensor diagnostics.
    env: {name: RC_LIDAR_TOPIC}
    api: {json_name: lidar_topic}
    ros: {launch_argument: lidar_topic, parameter: lidar_topic, value_type: string}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  diagnostics.imu_topic:
    type: string
    scope: robot_profile
    default: ""
    secret: false
    description: IMU topic used by sensor diagnostics.
    env: {name: RC_IMU_TOPIC}
    api: {json_name: imu_topic}
    ros: {launch_argument: imu_topic, parameter: imu_topic, value_type: string}
    modes: {local: true, docker: true, simulation: true, config_server: true}

  debug.enabled:
    type: boolean
    scope: runtime
    default: false
    secret: false
    description: Enable verbose ROS logging.
    env: {name: RC_DEBUG}
    api: {json_name: debug}
    ros: {launch_argument: "", parameter: "", value_type: env}
    modes: {local: true, docker: true, simulation: true, config_server: true}
